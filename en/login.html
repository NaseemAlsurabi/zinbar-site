<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZINBAR - Secure Login</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400;500;700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel=icon type="image/png" sizes=32x32 href="../favicon32x32.png">
    <link rel=icon type="image/png" sizes=16x16 href="../favicon16x16.png">
    <link rel=apple-touch-icon sizes=180x180 href="../favicon180x180.png">
    <style>
        :root {
            --black: #000;
            --yellow: #FFDF00;
            --white: #FFF;
            --gray: #b2b2b2;
            --orange: #FF6B00;
            --dark-gray: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        html, body {
            height: 100%;
            font-family: 'Manrope', sans-serif;
            background-color: var(--black);
            color: var(--white);
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(255, 107, 0, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(255, 223, 0, 0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 60% 80%, rgba(255, 107, 0, 0.06) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: 
                linear-gradient(rgba(255, 223, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 223, 0, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        .login-container {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 440px;
            position: relative;
        }

        .login-box::before,
        .login-box::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            z-index: 2;
        }

        .login-box::before {
            top: -2px; right: -2px;
            border-top: 3px solid var(--yellow);
            border-right: 3px solid var(--yellow);
        }

        .login-box::after {
            bottom: -2px; left: -2px;
            border-bottom: 3px solid var(--yellow);
            border-left: 3px solid var(--yellow);
        }

        .login-inner {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #2a2a2a;
            padding: 50px 40px;
            position: relative;
            backdrop-filter: blur(10px);
        }

        .login-inner::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; right: -1px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--yellow), var(--orange), var(--yellow), transparent);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-logo img {
            height: 90px;
            width: auto;
            display: block;
            margin: 0 auto 16px;
            filter: drop-shadow(0 0 20px rgba(255, 107, 0, 0.3));
        }

        .login-logo .brand-name {
            font-family: 'Tektur', sans-serif;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 6px;
            color: var(--white);
            text-transform: uppercase;
        }

        .login-logo .brand-name span {
            color: var(--yellow);
        }

        .login-logo .brand-subtitle {
            font-size: 11px;
            color: var(--gray);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 4px;
            font-family: 'Tektur', sans-serif;
        }

        .login-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #333);
        }

        .login-divider::after {
            background: linear-gradient(270deg, transparent, #333);
        }

        .login-divider span {
            color: var(--gray);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            white-space: nowrap;
            font-family: 'Tektur', sans-serif;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: var(--gray);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            font-family: 'Tektur', sans-serif;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper::before {
            content: '';
            position: absolute;
            left: 0; bottom: 0;
            width: 0; height: 2px;
            background: var(--yellow);
            transition: width 0.3s ease;
            z-index: 1;
        }

        .input-wrapper:focus-within::before {
            width: 100%;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid #2a2a2a;
            border-bottom: 1px solid #444;
            color: var(--white);
            padding: 14px 50px 14px 46px;
            font-size: 14px;
            font-family: 'Manrope', sans-serif;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.07);
            border-color: #444;
            border-bottom-color: var(--yellow);
        }

        .form-input::placeholder {
            color: #444;
            letter-spacing: 1px;
        }

        .input-icon-right {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #444;
            pointer-events: none;
            font-size: 16px;
        }

        .toggle-password {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #444;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
            font-size: 14px;
            transition: color 0.2s;
        }

        .toggle-password:hover {
            color: var(--yellow);
        }

        .error-message {
            display: none;
            color: #ff4444;
            font-size: 12px;
            margin-top: 8px;
            padding: 10px 14px;
            background: rgba(255, 68, 68, 0.08);
            border: 1px solid rgba(255, 68, 68, 0.2);
            border-left: 3px solid #ff4444;
        }

        .error-message.show {
            display: block;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }

        .btn-login {
            width: 100%;
            background: var(--yellow);
            color: var(--black);
            border: none;
            padding: 16px 24px;
            font-family: 'Tektur', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 28px;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.4s ease;
        }

        .btn-login:hover {
            background: #FFE840;
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(255, 223, 0, 0.25);
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .access-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            background: var(--orange);
            border-radius: 50%;
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .indicator-text {
            font-family: 'Tektur', sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            color: var(--orange);
            text-transform: uppercase;
        }

        .security-info {
            margin-top: 24px;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #333;
            font-size: 11px;
            letter-spacing: 1px;
            font-family: 'Tektur', sans-serif;
        }

        .security-info::before {
            content: '🔒';
            font-size: 12px;
        }

        @keyframes scanline {
            0% { top: -10%; }
            100% { top: 110%; }
        }

        .login-box .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 223, 0, 0.1), transparent);
            animation: scanline 4s linear infinite;
            pointer-events: none;
            z-index: 10;
        }

        /* Lang switch */
        .lang-switch {
            text-align: center;
            margin-top: 20px;
        }

        .lang-switch a {
            color: #444;
            font-size: 11px;
            letter-spacing: 2px;
            text-decoration: none;
            font-family: 'Tektur', sans-serif;
            text-transform: uppercase;
            transition: color 0.2s;
        }

        .lang-switch a:hover {
            color: var(--yellow);
        }

        @media (max-width: 480px) {
            .login-inner { padding: 36px 24px; }
            .login-logo .brand-name { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="scanline"></div>
            <div class="login-inner">
                <div class="login-logo">
                    <img src="../wp-content/uploads/zinbar_logo.png" alt="ZINBAR" />
                    <div class="brand-name">ZIN<span>BAR</span></div>
                    <div class="brand-subtitle">— Technologies —</div>
                </div>

                <div class="access-indicator">
                    <div class="indicator-dot"></div>
                    <span class="indicator-text">Restricted Zone</span>
                    <div class="indicator-dot"></div>
                </div>

                <div class="login-divider">
                    <span>Secure Access</span>
                </div>

                <form id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <input 
                                type="password" 
                                id="password" 
                                name="password"
                                class="form-input" 
                                placeholder="Enter password"
                                autocomplete="current-password"
                                spellcheck="false"
                            />
                            <span class="input-icon-right">🔑</span>
                            <button type="button" class="toggle-password" id="toggleBtn" onclick="togglePassword()" title="Show/Hide">
                                👁
                            </button>
                        </div>
                        <div id="errorMsg" class="error-message">
                            ❌ Incorrect password. Please try again.
                        </div>
                    </div>

                    <button type="submit" class="btn-login" id="loginBtn">
                        Enter
                    </button>
                </form>

                <div class="security-info">
                    Encrypted Secure Connection
                </div>
            </div>

            <div class="lang-switch">
                <a href="../ar/login.html">AR — العربية</a>
            </div>
        </div>
    </div>

    <script>
        const CORRECT_PASSWORD = 'ZINBAR_FPV';

        function handleLogin(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');
            const loginBtn = document.getElementById('loginBtn');

            errorMsg.classList.remove('show');

            if (password === CORRECT_PASSWORD) {
                loginBtn.classList.add('loading');
                loginBtn.textContent = 'Entering...';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 800);
            } else {
                errorMsg.classList.add('show');
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
                setTimeout(() => {
                    errorMsg.classList.remove('show');
                }, 4000);
            }
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const btn = document.getElementById('toggleBtn');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁';
            }
        }

        window.addEventListener('load', () => {
            document.getElementById('password').focus();
        });
    </script>
</body>
</html>
